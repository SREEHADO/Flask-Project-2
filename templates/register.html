{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="mb-3" style="font-size:3rem;">🎉</div>
                <h3 class="fw-bold page-header">Create Account</h3>
                <p class="text-muted small">Join NotesApp and start organizing your thoughts</p>
            </div>

            <form method="post" action="/register">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Choose a username" required minlength="3">
                    <div class="form-text">Minimum 3 characters. Must be unique.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="your@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" id="pwd" class="form-control"
                           placeholder="Create a strong password" required minlength="6">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" id="cpwd" class="form-control"
                           placeholder="Repeat your password" required>
                    <!-- This div shows validation message — filled by JS below -->
                    <div id="pwdMatch" class="form-text"></div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg fw-semibold">
                        <i class="bi bi-person-plus me-2"></i>Create Account
                    </button>
                </div>

            </form>

            <hr>
            <p class="text-center text-muted small mb-0">
                Already have an account?
                <a href="/login" class="fw-semibold text-decoration-none" style="color:#6366f1;">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Real-time password match validation
    const pwd  = document.getElementById('pwd');
    const cpwd = document.getElementById('cpwd');
    const msg  = document.getElementById('pwdMatch');
    const btn  = document.getElementById('submitBtn');

    cpwd.addEventListener('input', function () {
        if (cpwd.value === '') {
            msg.textContent = '';
            btn.disabled = false;
        } else if (pwd.value !== cpwd.value) {
            msg.textContent = '❌ Passwords do not match';
            msg.style.color = '#ef4444';
            btn.disabled = true;
        } else {
            msg.textContent = '✅ Passwords match';
            msg.style.color = '#10b981';
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
