{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <div style="font-size:3rem;">🔑</div>
                <h3 class="fw-bold page-header mt-2">Set New Password</h3>
                <p class="text-muted small">Choose a strong new password.</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="password" id="newPwd" class="form-control form-control-lg"
                           placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" id="confirmPwd" class="form-control form-control-lg"
                           placeholder="Repeat new password" required>
                    <div id="matchMsg" class="form-text"></div>
                </div>
                <div class="d-grid">
                    <button type="submit" id="resetBtn" class="btn btn-primary btn-lg fw-semibold">
                        <i class="bi bi-shield-check me-2"></i>Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const p1  = document.getElementById('newPwd');
    const p2  = document.getElementById('confirmPwd');
    const msg = document.getElementById('matchMsg');
    const btn = document.getElementById('resetBtn');

    p2.addEventListener('input', () => {
        if (p1.value !== p2.value) {
            msg.textContent = '❌ Passwords do not match';
            msg.style.color = '#ef4444';
            btn.disabled = true;
        } else {
            msg.textContent = '✅ Passwords match';
            msg.style.color = '#10b981';
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
