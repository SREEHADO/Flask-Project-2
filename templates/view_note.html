{% extends "base.html" %}
{% block title %}{{ note[1] }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h3 class="page-header mb-0">View Note</h3>
        </div>

        <div class="card p-4 p-md-5">
            <h2 class="fw-bold mb-2" style="color:#1f2937;">{{ note[1] }}</h2>
            <p class="text-muted small mb-4">
                <i class="bi bi-clock me-1"></i>
                Created on {{ note[4] if note[4] else 'Unknown date' }}
            </p>
            <hr>
            <!-- white-space:pre-wrap preserves newlines typed by the user -->
            <div class="note-content lh-lg" style="white-space: pre-wrap; color:#374151;">{{ note[2] }}</div>
            <hr>
            <div class="d-flex gap-3 mt-3">
                <a href="/editnote/{{ note[0] }}" class="btn btn-warning flex-fill fw-semibold">
                    <i class="bi bi-pencil me-2"></i>Edit Note
                </a>
                <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#confirmDelete">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="confirmDelete" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger fw-bold">
                    <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Delete <strong>"{{ note[1] }}"</strong>? This cannot be undone.
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form method="post" action="/deletenote/{{ note[0] }}">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
